<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工場入場 判断フォーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js"></script>
    <style>
        body { font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="bg-white shadow-sm p-4 mb-4">
        <div class="max-w-lg mx-auto flex justify-between items-center gap-2">
            <h1 class="font-bold text-lg text-gray-700">工場入場 判断依頼一覧</h1>
            <button onclick="fetchJudgeList()" class="text-sm border border-gray-300 rounded px-3 py-1 bg-white hover:bg-gray-50 whitespace-nowrap">再読込</button>
        </div>
    </header>

    <div id="loading" class="fixed inset-0 bg-white bg-opacity-80 flex justify-center items-center z-50 hidden">
        <div class="flex flex-col items-center"><div class="loader mb-2"></div><p id="loadingText" class="text-sm text-gray-600 font-bold">通信中...</p></div>
    </div>

    <main class="px-4 pb-20 max-w-lg mx-auto">

        <!-- WOFF から氏名を取得できたときの表示 -->
        <div id="judgeInfo" class="hidden bg-blue-50 border-l-4 border-blue-500 p-3 rounded mb-4">
            <p class="text-xs text-blue-700 font-bold mb-1">判断者</p>
            <p id="judgeInfoName" class="font-bold text-gray-800"></p>
        </div>

        <!-- PCブラウザなど、WOFF から氏名を取得できないときの入力欄 -->
        <div id="judgeNameBox" class="hidden bg-yellow-50 border-l-4 border-yellow-400 p-3 rounded mb-4">
            <label class="block text-xs text-yellow-800 font-bold mb-1">判断者名（記録用）</label>
            <input type="text" id="judgeNameInput" maxlength="50" class="w-full border border-gray-300 rounded-md p-2 bg-white outline-none" placeholder="例：山田太郎">
            <p class="text-xs text-yellow-700 mt-1">※誰が判断したかを記録するために使用します。次回から自動入力されます。</p>
        </div>

        <div id="judgementList" class="space-y-4"></div>

        <div id="emptyState" class="hidden text-center py-20">
            <p class="text-gray-400 font-bold">現在、判断待ちの申請はありません。</p>
        </div>

        <div id="errorState" class="hidden text-center py-20">
            <p class="text-red-500 font-bold mb-3">リストの取得に失敗しました。</p>
            <button onclick="fetchJudgeList()" class="border border-gray-300 rounded px-4 py-2 bg-white hover:bg-gray-50 text-sm font-bold">再読込</button>
        </div>
    </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyKgHIo5Gb_2PMIaOSBs5BLzeu9Lsz5KW8eiTZnYDhZolIebOz7x3kzE98Y6SIEIiMt/exec";

        // ver1 では URL 全体が入っていたため woff.init() が必ず失敗していた。IDのみを指定する。
        const WOFF_ID = "geWMgEPIfkNzWbzjeSl0Ng";

        const JUDGE_NAME_STORAGE_KEY = "entryPermit.judgeName";

        // userId は WOFF 経由でのみ取得できる。取得できた場合、GAS側で承認者かどうかを照合する。
        let judgeUser = { id: "", name: "" };
        let isProcessing = false;

        // ---------- 共通ユーティリティ ----------

        function esc(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function showLoading(show, text = "通信中...") {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        async function fetchGasPost(action, payload) {
            const res = await fetch(GAS_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: action, payload: payload })
            });
            if (!res.ok) throw new Error(`通信エラー (${res.status})`);
            return res.json();
        }

        function loadStoredJudgeName() {
            try { return localStorage.getItem(JUDGE_NAME_STORAGE_KEY) || ""; }
            catch (e) { return ""; }
        }

        function saveJudgeName(name) {
            try { localStorage.setItem(JUDGE_NAME_STORAGE_KEY, name); } catch (e) {}
        }

        // 判断者名を確定する。WOFF が使えない場合は入力欄の値を使う。
        function resolveJudgeName() {
            if (judgeUser.name) return judgeUser.name;
            const input = document.getElementById('judgeNameInput').value.trim();
            return input;
        }

        // ---------- 初期化 ----------

        window.onload = () => {
            if (typeof woff !== 'undefined' && woff.init) {
                woff.init({ woffId: WOFF_ID })
                    .then(() => woff.getProfile())
                    .then(profile => {
                        judgeUser.id = profile.userId || "";
                        judgeUser.name = profile.displayName || "";
                        if (judgeUser.name) {
                            document.getElementById('judgeInfoName').textContent = judgeUser.name;
                            document.getElementById('judgeInfo').classList.remove('hidden');
                        } else {
                            activateNameInput();
                        }
                        fetchJudgeList();
                    })
                    .catch(() => { activateNameInput(); fetchJudgeList(); });
            } else {
                activateNameInput();
                fetchJudgeList();
            }
        };

        // PCブラウザ版など、WOFF から情報を取得できない環境向け
        function activateNameInput() {
            const box = document.getElementById('judgeNameBox');
            const input = document.getElementById('judgeNameInput');
            input.value = loadStoredJudgeName();
            box.classList.remove('hidden');
        }

        // ---------- 一覧取得 ----------

        async function fetchJudgeList() {
            const container = document.getElementById('judgementList');
            const empty = document.getElementById('emptyState');
            const errorBox = document.getElementById('errorState');

            empty.classList.add('hidden');
            errorBox.classList.add('hidden');

            showLoading(true, "未判断リストを取得中...");
            try {
                // 判断待ちの絞り込みと入場日順の並べ替えはGAS側で行う
                const json = await fetchGasPost('getPendingList', {});
                if (json.status !== 'success') throw new Error(json.message);
                renderList(json.data || []);
            } catch (e) {
                container.innerHTML = "";
                errorBox.classList.remove('hidden');
            } finally {
                showLoading(false);
            }
        }

        function renderList(list) {
            const container = document.getElementById('judgementList');
            const empty = document.getElementById('emptyState');

            if (!list || list.length === 0) {
                container.innerHTML = "";
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            container.innerHTML = list.map(item => {
                // 入場日を過ぎたまま残っているものは目立たせる
                const pastBadge = item.isPast
                    ? '<span class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-bold">入場日経過</span>'
                    : '';

                return `
                <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200">
                    <div class="bg-gray-50 px-4 py-2 border-b border-gray-100 flex justify-between items-center gap-2">
                        <span class="text-xs font-bold text-gray-500">申請者: ${esc(item.userName)}</span>
                        ${pastBadge}
                    </div>
                    <div class="p-4 space-y-2">
                        <div class="flex items-start">
                            <span class="w-24 shrink-0 text-sm font-bold text-gray-500">入場日</span>
                            <span class="text-sm font-bold text-gray-800">${esc(item.entryDate)}</span>
                        </div>
                        <div class="flex items-start">
                            <span class="w-24 shrink-0 text-sm font-bold text-gray-500">予定時間</span>
                            <span class="text-sm text-gray-800">${esc(item.startTime)} ～ ${esc(item.endTime)}</span>
                        </div>
                        <div class="flex items-start">
                            <span class="w-24 shrink-0 text-sm font-bold text-gray-500">来客名/人数</span>
                            <span class="text-sm text-gray-800">${esc(item.affiliation)}（${esc(item.peopleCount)}名）</span>
                        </div>
                        <div class="flex items-start">
                            <span class="w-24 shrink-0 text-sm font-bold text-gray-500">場所</span>
                            <span class="text-sm font-bold text-blue-600">${esc(item.factoryType)}</span>
                        </div>
                        <div class="flex items-start">
                            <span class="w-24 shrink-0 text-sm font-bold text-gray-500">目的</span>
                            <span class="text-sm text-gray-700 whitespace-pre-wrap">${esc(item.purpose)}</span>
                        </div>
                        <div class="flex items-start">
                            <span class="w-24 shrink-0 text-sm font-bold text-gray-500">申請日時</span>
                            <span class="text-sm text-gray-500">${esc(item.appliedAt)}</span>
                        </div>

                        <div class="mt-4 pt-4 border-t border-gray-100">
                            <label class="block text-xs font-bold text-gray-400 mb-1">許可・却下理由（却下時は入力必須）</label>
                            <textarea id="comment-${esc(item.uid)}" rows="2" maxlength="500" class="w-full border border-gray-200 rounded p-2 text-sm outline-none focus:border-blue-400" placeholder="メッセージを入力..."></textarea>
                        </div>

                        <div class="flex gap-3 mt-4">
                            <button onclick="submitJudgment('${esc(item.uid)}', '却下')" class="judge-btn flex-1 bg-white border-2 border-red-500 text-red-500 font-bold py-2 rounded-lg hover:bg-red-50 disabled:opacity-50 transition">
                                却下
                            </button>
                            <button onclick="submitJudgment('${esc(item.uid)}', '許可')" class="judge-btn flex-1 bg-green-500 text-white font-bold py-2 rounded-lg hover:bg-green-600 shadow-md disabled:opacity-50 transition">
                                許可する
                            </button>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }

        function setButtonsDisabled(disabled) {
            document.querySelectorAll('.judge-btn').forEach(btn => { btn.disabled = disabled; });
        }

        // ---------- 判断 ----------

        async function submitJudgment(uid, judgment) {
            if (isProcessing) return;

            const judgeName = resolveJudgeName();
            if (!judgeName) {
                alert("判断者名を入力してください。");
                document.getElementById('judgeNameInput').focus();
                return;
            }

            const textarea = document.getElementById(`comment-${uid}`);
            const comment = textarea ? textarea.value.trim() : '';

            if (judgment === '却下' && !comment) {
                alert("却下する場合は、却下理由を入力してください。");
                if (textarea) textarea.focus();
                return;
            }

            if (!confirm(`${judgment}処理を実行しますか？`)) return;

            isProcessing = true;
            setButtonsDisabled(true);
            showLoading(true, "処理中...");
            try {
                const json = await fetchGasPost('judge', {
                    uid: uid,
                    judgment: judgment,
                    comment: comment,
                    execUserId: judgeUser.id,   // WOFF経由のときのみ値が入る
                    execUserName: judgeName
                });
                if (json.status !== 'success') throw new Error(json.message);

                if (!judgeUser.name) saveJudgeName(judgeName);

                alert(json.warning
                    ? `${judgment}処理が完了しました。\n\n${json.warning}`
                    : `${judgment}処理が完了しました。`);

                await fetchJudgeList();
            } catch (e) {
                alert("エラーが発生しました: " + e.message);
            } finally {
                isProcessing = false;
                setButtonsDisabled(false);
                showLoading(false);
            }
        }
    </script>
</body>
</html>
