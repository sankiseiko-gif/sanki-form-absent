<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>承認管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js"></script>
    <style>
        body { font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="bg-blue-600 text-white text-center py-4 shadow-md mb-4">
        <h1 class="text-lg font-bold">申請 承認管理</h1>
        <p class="text-xs text-blue-200 mt-1" id="userNameDisplay">読込中...</p>
    </div>

    <div id="loading" class="fixed inset-0 bg-white bg-opacity-80 flex justify-center items-center z-50 hidden">
        <div class="flex flex-col items-center"><div class="loader mb-2"></div><p id="loadingText" class="text-sm text-gray-600 font-bold">通信中...</p></div>
    </div>

    <main class="px-4 pb-8 max-w-lg mx-auto">
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-gray-700">承認待ち一覧</h2>
            <button onclick="fetchListData()" class="text-sm bg-white border border-gray-300 text-gray-600 px-3 py-1.5 rounded shadow-sm hover:bg-gray-50 font-bold">🔄 更新</button>
        </div>

        <div id="approveList" class="space-y-4"></div>
    </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxwEuHjXVsUjbhH9Bo5yQ3vgln5LM615sKftO5pQgzjpPzpRvXuxMcqmyNTNhEhaQeZ/exec";
        const WOFF_ID = "RAj4F7BMV-oVhCo-nRSaXw"; 
        
        // 権限(role)は使わないため、idとnameのみに変更
        let currentUser = { id: "", name: "" };

        window.onload = () => {
            if (typeof woff !== 'undefined' && woff.init) {
                woff.init({ woffId: WOFF_ID })
                .then(() => woff.getProfile())
                .then(profile => {
                    currentUser.id = profile.userId;
                    initApp();
                })
                .catch(err => alert("WOFF初期化エラー。LINE WORKS環境で開いてください。"));
            } else {
                alert("WOFF SDKが読み込めません。");
            }
        }

        async function initApp() {
            showLoading(true, "ユーザー確認中...");
            try {
                const json = await fetchGasPost('getUser', { userId: currentUser.id });
                if (json.status === 'success' && json.data.userName) {
                    currentUser.name = json.data.userName;
                    document.getElementById('userNameDisplay').innerText = `${currentUser.name} さん`;
                    fetchListData();
                } else {
                    document.getElementById('userNameDisplay').innerText = "未登録ユーザー";
                    alert("マスタに登録されていません。");
                }
            } catch (e) {
                alert("ユーザー情報の取得に失敗しました。");
            } finally {
                showLoading(false);
            }
        }

        // ▼ スマホの通信エラー対策（redirect: "follow" を追加）
        async function fetchGasPost(action, payload) {
            const res = await fetch(GAS_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: action, payload: payload }),
                redirect: "follow" // スマホブラウザでのリダイレクト遮断を防ぐ
            });
            return res.json();
        }

        function showLoading(show, text = "通信中...") {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        async function fetchListData() {
            showLoading(true, "リスト取得中...");
            try {
                // 権限のパラメータ送信を削除
                const json = await fetchGasPost('getList', { userId: currentUser.id });
                if (json.status === 'success') {
                    // 「仮申請」または「取消申請中」のものだけを抽出
                    const pendingList = json.data.filter(item => item.status === '仮申請' || item.status === '取消申請中');
                    renderApproveList(pendingList);
                } else {
                    throw new Error(json.message);
                }
            } catch (e) {
                alert("リスト取得失敗: " + e.message);
            } finally {
                showLoading(false);
            }
        }

        function renderApproveList(list) {
            const container = document.getElementById('approveList');
            if (list.length === 0) {
                container.innerHTML = '<div class="bg-white p-6 rounded-lg text-center text-gray-500 shadow-sm border border-gray-100 font-bold">現在、承認待ちの申請はありません</div>';
                return;
            }

            container.innerHTML = list.map(item => `
                <div class="bg-white p-4 rounded-lg shadow-sm border-t-4 ${item.status === '取消申請中' ? 'border-red-400' : 'border-blue-500'} relative">
                    ${item.status === '取消申請中' ? '<span class="absolute top-2 right-2 bg-red-100 text-red-600 text-[10px] font-bold px-2 py-0.5 rounded border border-red-200">取消依頼</span>' : ''}
                    
                    <div class="flex items-center gap-2 mb-3">
                        <div class="bg-gray-100 w-10 h-10 rounded-full flex items-center justify-center font-bold text-gray-500 shrink-0 text-sm">
                            ${item.applicantName.charAt(0)}
                        </div>
                        <div>
                            <p class="font-bold text-gray-800 leading-tight">${item.applicantName}</p>
                            <p class="text-xs text-gray-500">${item.category}</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-y-2 text-sm text-gray-700 bg-gray-50 p-3 rounded mb-3 border border-gray-100">
                        <div class="col-span-2">
                            <span class="font-bold text-gray-500 text-xs block mb-0.5">対象日時</span>
                            ${item.startDate} ${item.endDate && item.startDate !== item.endDate ? `～ ${item.endDate}` : ''}
                            <br><span class="text-blue-600 font-bold">${item.startTime} ～ ${item.endTime}</span>
                        </div>
                        ${item.compDate ? `<div class="col-span-2 border-t border-gray-200 pt-2 mt-1"><span class="font-bold text-blue-500 text-xs block mb-0.5">振替対象日</span>${item.compDate}</div>` : ''}
                        <div class="col-span-2 mt-1">
                            <span class="font-bold text-gray-500 text-xs block mb-0.5">理由</span>
                            <div class="whitespace-pre-wrap">${item.reason || 'なし'}</div>
                        </div>
                    </div>

                    <button id="btn-${item.uid}" class="w-full ${item.status === '取消申請中' ? 'bg-red-500 hover:bg-red-600' : 'bg-blue-600 hover:bg-blue-700'} text-white font-bold rounded-md py-3 transition shadow disabled:bg-gray-400" 
                        onclick="approveRequest('${item.uid}', '${item.status}')">
                        ${item.status === '取消申請中' ? '取消を承認する' : '承認する'}
                    </button>
                </div>
            `).join('');
        }

        async function approveRequest(uid, currentStatus) {
            const confirmMsg = currentStatus === '取消申請中' ? "取消を承認しますか？" : "承認しますか？";
            if(!confirm(confirmMsg)) return;
            
            const btn = document.getElementById(`btn-${uid}`);
            btn.disabled = true;
            showLoading(true, "処理中...");
            try {
                // 実行者の権限(execRole)を削除。名前のみ送信。
                const json = await fetchGasPost('approve', { uid: uid, execUserName: currentUser.name });
                if (json.status === 'success') { 
                    btn.innerText = "✅ 承認完了";
                    btn.classList.replace('bg-blue-600', 'bg-green-500');
                    btn.classList.replace('bg-red-500', 'bg-green-500');
                    setTimeout(() => fetchListData(), 1000);
                } else throw new Error(json.message);
            } catch (e) { 
                alert("エラー: " + e.message); 
                btn.disabled = false; 
            }
            finally { showLoading(false); }
        }
    </script>
</body>
</html>
