<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>休暇・外出申請</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js"></script>
    <style>
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="flex border-b">
            <button id="tab-apply" onclick="switchTab('apply')" class="flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 transition">新規申請</button>
            <button id="tab-list" onclick="switchTab('list')" class="flex-1 py-3 text-center font-bold text-gray-500 border-b-2 border-transparent transition">申請履歴・取消</button>
        </div>
    </nav>

    <div class="p-4 max-w-md mx-auto">
        <section id="applySection" class="fade-in">
            <form id="applyForm" class="space-y-4 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">区分</label>
                    <select name="category" class="w-full border rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="有給休暇">有給休暇</option>
                        <option value="午前半休">午前半休</option>
                        <option value="午後半休">午後半休</option>
                        <option value="外出">外出</option>
                        <option value="直行・直帰">直行・直帰</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">対象日</label>
                    <input type="date" name="startDate" required class="w-full border rounded-lg p-2.5 bg-gray-50">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">開始時間</label>
                        <input type="time" name="startTime" value="08:30" class="w-full border rounded-lg p-2.5 bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">終了時間</label>
                        <input type="time" name="endTime" value="17:30" class="w-full border rounded-lg p-2.5 bg-gray-50">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">理由</label>
                    <textarea name="reason" rows="2" class="w-full border rounded-lg p-2.5 bg-gray-50" placeholder="私用のため等"></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-blue-700 active:scale-95 transition">申請を送信する</button>
            </form>
        </section>

        <section id="listSection" class="hidden fade-in">
            <div id="listContainer" class="space-y-3">
                <p class="text-center text-gray-500 py-10">読み込み中...</p>
            </div>
        </section>
    </div>

    <div id="loadingOverlay" class="fixed inset-0 bg-black/20 hidden flex flex-col items-center justify-center z-[100]">
        <div class="bg-white p-5 rounded-2xl shadow-xl flex flex-col items-center">
            <div class="loader mb-3"></div>
            <p id="loadingText" class="text-sm font-bold text-gray-600">処理中...</p>
        </div>
    </div>

    <script>
        const GAS_URL = "YOUR_GAS_WEBAPP_URL"; // 👈 ご自身のデプロイURLに書き換えてください
        let currentUser = { id: '', name: '', role: 'user' };
        let currentTab = 'apply';

        async function initWoff() {
            try {
                await woff.init({ woffId: "YOUR_WOFF_ID" }); // 👈 ご自身のWOFF ID
                const profile = await woff.getProfile();
                currentUser.id = profile.userId;
                currentUser.name = profile.displayName;
                // ロールの判定が必要な場合はここで実装（暫定でURLパラメータから取得可能に）
                const params = new URLSearchParams(window.location.search);
                currentUser.role = params.get('role') || 'user';
            } catch (err) { alert("初期化失敗: " + err.message); }
        }

        function switchTab(tab) {
            currentTab = tab;
            const applySec = document.getElementById('applySection');
            const listSec = document.getElementById('listSection');
            const tabA = document.getElementById('tab-apply');
            const tabL = document.getElementById('tab-list');

            if (tab === 'apply') {
                applySec.classList.remove('hidden');
                listSec.classList.add('hidden');
                tabA.className = "flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600";
                tabL.className = "flex-1 py-3 text-center font-bold text-gray-500 border-b-2 border-transparent";
            } else {
                applySec.classList.add('hidden');
                listSec.classList.remove('hidden');
                tabL.className = "flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600";
                tabA.className = "flex-1 py-3 text-center font-bold text-gray-500 border-b-2 border-transparent";
                fetchListData();
            }
        }

        async function fetchListData() {
            const container = document.getElementById('listContainer');
            container.innerHTML = '<div class="flex justify-center py-10"><div class="loader"></div></div>';
            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getList', data: { userId: currentUser.id, role: currentUser.role } })
                });
                const data = await res.json();
                renderList(data);
            } catch (err) { container.innerHTML = '<p class="text-red-500">データ取得失敗</p>'; }
        }

        function renderList(data) {
            const container = document.getElementById('listContainer');
            if (!data || data.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-10">申請履歴はありません</p>';
                return;
            }
            container.innerHTML = data.map(item => `
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 ${item.status === '完了' ? 'border-green-500' : 'border-blue-500'} mb-3">
                    <div class="flex justify-between items-start mb-2">
                        <span class="font-bold text-blue-700">${item.category}</span>
                        <span class="text-xs px-2 py-1 rounded-full ${item.status === '完了' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}">${item.status}</span>
                    </div>
                    <p class="text-sm text-gray-600">${item.startDate} ${item.startTime}〜${item.endTime}</p>
                    <p class="text-xs text-gray-400 mt-1">${item.reason || ''}</p>
                    ${(currentTab === 'list' && (item.status === '申請中' || item.status === '完了')) ? `
                        <button onclick="cancelRequest('${item.uid}')" class="w-full mt-3 py-2 text-sm font-bold text-red-500 border border-red-200 rounded-lg hover:bg-red-50 transition">この申請を取り消す</button>
                    ` : ''}
                    ${(currentUser.role === 'soumu' && item.status === '申請中') ? `
                        <button onclick="approveRequest('${item.uid}')" class="w-full mt-2 py-2 text-sm font-bold text-white bg-blue-600 rounded-lg shadow-sm">承認する（代行）</button>
                    ` : ''}
                </div>
            `).join('');
        }

        async function cancelRequest(uid) {
            if (!confirm("本当に取り消しますか？")) return;
            toggleOverlay(true, "取消処理中...");
            try {
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'cancel', data: { uid: uid } }) });
                alert("取り消しました。");
                fetchListData();
            } catch (err) { alert("エラー: " + err.message); }
            finally { toggleOverlay(false); }
        }

        async function approveRequest(uid) {
            if (!confirm("承認しますか？")) return;
            toggleOverlay(true, "承認処理中...");
            try {
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'approve', data: { uid: uid, execUserName: currentUser.name } }) });
                alert("承認完了しました。");
                fetchListData();
            } catch (err) { alert("エラー: " + err.message); }
            finally { toggleOverlay(false); }
        }

        document.getElementById('applyForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.userId = currentUser.id;
            data.userName = currentUser.name;

            toggleOverlay(true, "申請送信中...");
            try {
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'submit', data: data }) });
                alert("申請を送信しました。");
                e.target.reset();
                switchTab('list');
            } catch (err) { alert("送信エラー"); }
            finally { toggleOverlay(false); }
        };

        function toggleOverlay(show, text) {
            const el = document.getElementById('loadingOverlay');
            document.getElementById('loadingText').innerText = text || "処理中...";
            show ? el.classList.remove('hidden') : el.classList.add('hidden');
        }

        window.onload = initWoff;
    </script>
</body>
</html>
