<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>休暇申請ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js"></script>
    <style>
        body { font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <nav id="mainNav" class="bg-white shadow-sm mb-4">
        <div class="flex justify-around">
            <button id="tabBtn-apply" class="flex-1 py-3 text-sm font-bold text-blue-600 border-b-2 border-blue-600 transition" onclick="switchTab('apply')">申請</button>
            <button id="tabBtn-history" class="flex-1 py-3 text-sm font-bold text-gray-400 border-b-2 border-transparent transition" onclick="switchTab('history')">履歴・取消</button>
        </div>
    </nav>

    <div id="loading" class="fixed inset-0 bg-white bg-opacity-80 flex justify-center items-center z-50 hidden">
        <div class="flex flex-col items-center"><div class="loader mb-2"></div><p id="loadingText" class="text-sm text-gray-600 font-bold">通信中...</p></div>
    </div>

    <main class="px-4 pb-8 max-w-lg mx-auto">
        <section id="tab-apply">
            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-100">
                <div class="bg-green-50 border-l-4 border-green-500 p-3 rounded mb-5">
                    <p class="text-xs text-green-700 font-bold mb-1">申請者情報</p>
                    <div class="flex items-center gap-2">
                        <input type="text" id="userName" class="w-full bg-transparent font-bold text-gray-800 outline-none" placeholder="情報を取得中..." readonly>
                        <button id="authByNameBtn" onclick="authenticateByName()" class="hidden bg-green-600 hover:bg-green-700 text-white text-xs font-bold px-4 py-2 rounded shadow whitespace-nowrap">連携</button>
                    </div>
                    <p id="fallbackMessage" class="text-xs text-red-500 mt-2 hidden">※氏名を漢字で入力して「連携」ボタンを押してください。</p>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-bold mb-1 text-gray-700">種別</label>
                    <select id="typeSelect" class="w-full border border-gray-300 rounded-md p-2.5 bg-gray-50 outline-none" onchange="handleTypeChange()">
                        <option value="">選択してください</option>
                        <option value="遅刻">遅刻</option>
                        <option value="早退">早退</option>
                        <option value="欠勤">欠勤</option>
                        <option value="外出">外出</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-bold mb-1 text-gray-700">区分</label>
                    <select id="categorySelect" class="w-full border border-gray-300 rounded-md p-2.5 bg-gray-50 outline-none" onchange="handleCategoryChange()">
                        <option value="">選択してください</option>
                        <option value="有給">有給</option>
                        <option value="AM半休">AM半休</option>
                        <option value="PM半休">PM半休</option>
                        <option value="忌引">忌引</option>
                        <option value="結婚">結婚</option>
                        <option value="振替休日">振替休日</option>
                        <option value="欠勤">欠勤</option>
                        <option value="遅刻">遅刻</option>
                        <option value="早退">早退</option>
                        <option value="外出" class="hidden">外出</option>
                    </select>
                </div>

                <div id="compDateWrapper" class="mb-4 hidden border-l-4 border-blue-400 pl-3 bg-blue-50 p-2 rounded-r">
                    <label class="block text-sm font-bold mb-1 text-blue-700">振替対象日</label>
                    <input type="date" id="compDate" class="w-full border border-blue-200 rounded p-2 bg-white outline-none">
                </div>

                <div class="mb-5 border border-gray-200 p-4 rounded-md bg-gray-50">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-bold text-gray-700">対象日</label>
                        <label class="flex items-center text-sm cursor-pointer text-blue-600 font-bold">
                            <input type="checkbox" id="periodCheck" class="mr-1 accent-blue-600" onchange="handlePeriodChange()"> 期間で入力
                        </label>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="date" id="startDate" class="flex-1 border border-gray-300 rounded p-2 outline-none">
                        <span id="periodToLabel" class="hidden text-gray-500 font-bold">～</span>
                        <input type="date" id="endDate" class="flex-1 border border-gray-300 rounded p-2 hidden outline-none">
                    </div>
                </div>

                <div class="mb-5">
                    <label class="block text-sm font-bold mb-1 text-gray-700">時間</label>
                    <div class="flex items-center gap-2">
                        <input type="time" id="startTime" class="flex-1 border border-gray-300 rounded p-2 bg-white outline-none">
                        <span class="text-gray-500 font-bold">～</span>
                        <input type="time" id="endTime" class="flex-1 border border-gray-300 rounded p-2 bg-white outline-none">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-bold mb-1 text-gray-700">理由</label>
                    <textarea id="reason" rows="3" class="w-full border border-gray-300 rounded-md p-2 bg-white outline-none" placeholder="自由記入"></textarea>
                </div>

                <button id="submitBtn" onclick="submitApplication()" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-lg shadow-md hover:bg-blue-700 transition disabled:bg-gray-400">
                    申請を送信する
                </button>
            </div>
        </section>

        <section id="tab-history" class="hidden">
            <h3 class="font-bold text-gray-700 mb-3 ml-1">直近の申請履歴</h3>
            <div id="historyList" class="space-y-3"></div>
        </section>
    </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxwEuHjXVsUjbhH9Bo5yQ3vgln5LM615sKftO5pQgzjpPzpRvXuxMcqmyNTNhEhaQeZ/exec"; 
        const WOFF_ID = "RAj4F7BMV-oVhCo-nRSaXw";
        let currentUser = { id: "", name: "" };
        let isFallbackMode = false;

        window.onload = () => {
            if (typeof woff !== 'undefined' && woff.init) {
                woff.init({ woffId: WOFF_ID })
                .then(() => woff.getProfile())
                .then(profile => {
                    currentUser.id = profile.userId;
                    initApp('apply');
                })
                .catch(() => activateFallbackMode('apply'));
            } else {
                activateFallbackMode('apply');
            }
        }
        
        function activateFallbackMode(targetTab) {
            isFallbackMode = true;
            const un = document.getElementById('userName');
            un.placeholder = "氏名を漢字で入力";
            un.removeAttribute('readonly');
            un.classList.remove('bg-transparent', 'font-bold');
            un.classList.add('border', 'border-gray-300', 'bg-white', 'p-2', 'rounded-md');
            document.getElementById('authByNameBtn').classList.remove('hidden');
            document.getElementById('fallbackMessage').classList.remove('hidden');
            switchTab(targetTab);
        }

        async function initApp(targetTab) {
            showLoading(true, "ユーザー情報を取得中...");
            try {
                const json = await fetchGasPost('getUser', { userId: currentUser.id });
                if (json.status === 'success' && json.data.userName) {
                    currentUser.name = json.data.userName;
                    document.getElementById('userName').value = currentUser.name;
                } else { throw new Error(); }
                switchTab(targetTab);
            } catch (e) { activateFallbackMode(targetTab); }
            finally { showLoading(false); }
        }

        async function authenticateByName() {
            const nameInput = document.getElementById('userName').value.trim();
            if (!nameInput) return alert("氏名を入力してください。");
            showLoading(true, "マスタと連携中...");
            try {
                const json = await fetchGasPost('getUserByName', { userName: nameInput });
                if (json.status === 'success' && json.data) {
                    currentUser.id = json.data.userId;
                    currentUser.name = json.data.userName;
                    const un = document.getElementById('userName');
                    un.setAttribute('readonly', 'true');
                    un.classList.remove('border', 'border-gray-300', 'bg-white');
                    un.classList.add('bg-transparent', 'font-bold');
                    document.getElementById('authByNameBtn').classList.add('hidden');
                    document.getElementById('fallbackMessage').classList.add('hidden');
                    alert(`「${currentUser.name}」さんとして連携しました。`);
                    switchTab('apply');
                } else { alert("マスタに該当する名前が見つかりません。"); }
            } catch (e) { alert("通信エラーが発生しました。"); }
            finally { showLoading(false); }
        }

        function switchTab(tabId) {
            ['apply', 'history'].forEach(id => {
                const section = document.getElementById('tab-' + id);
                const btn = document.getElementById('tabBtn-' + id);
                if (id === tabId) {
                    section?.classList.remove('hidden');
                    btn?.classList.add('text-blue-600', 'border-blue-600');
                    btn?.classList.remove('text-gray-400', 'border-transparent');
                } else {
                    section?.classList.add('hidden');
                    btn?.classList.remove('text-blue-600', 'border-blue-600');
                    btn?.classList.add('text-gray-400', 'border-transparent');
                }
            });
            if (tabId === 'history') {
                if (isFallbackMode && !currentUser.id) {
                    alert("まずは氏名を連携してください。");
                    switchTab('apply');
                } else { fetchListData(); }
            }
        }

        function showLoading(show, text = "通信中...") {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

       function handleTypeChange() {
           const type = document.getElementById('typeSelect').value;
           const cat  = document.getElementById('categorySelect');
           const st   = document.getElementById('startTime');
           const et   = document.getElementById('endTime');

           if (type === '遅刻') {
                st.value = '08:30';
                et.value = '';
                if (cat.value === '外出') cat.value = '';
           } else if (type === '早退') {
                st.value = '';
                et.value = '17:30';
                if (cat.value === '外出') cat.value = '';
          } else if (type === '欠勤') {
               st.value = '08:30';
               et.value = '17:30';
               if (cat.value === '外出') cat.value = ''; // ※前に外出を選んでいた場合のみリセット
         } else if (type === '外出') {
               st.value = '';
               et.value = '';
               cat.value = '外出';
        } else {
        if (cat.value === '外出') {
            cat.value = '';
            }
        }
        if (typeof handleCategoryChange === 'function') {
            handleCategoryChange();
            }
        }

        function handleCategoryChange() {
            const cat = document.getElementById('categorySelect').value;
            const wrap = document.getElementById('compDateWrapper');
            if (cat === '振替休日') wrap.classList.remove('hidden');
            else { wrap.classList.add('hidden'); document.getElementById('compDate').value = ''; }
        }

        function handlePeriodChange() {
            const isP = document.getElementById('periodCheck').checked;
            const ew = document.getElementById('endDate');
            const lb = document.getElementById('periodToLabel');
            if (isP) { ew.classList.remove('hidden'); lb.classList.remove('hidden'); }
            else { ew.classList.add('hidden'); lb.classList.add('hidden'); ew.value = ''; }
        }

        async function fetchGasPost(action, payload) {
            const res = await fetch(GAS_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: action, payload: payload })
            });
            return res.json();
        }

         async function submitApplication() {
            const isPeriod = document.getElementById('periodCheck').checked;
            const typeVal = document.getElementById('typeSelect').value;
            const catVal = document.getElementById('categorySelect').value;
            const sDateVal = document.getElementById('startDate').value;
            // 期間指定がONならendDateの値を、OFFならstartDateの値を終了日とする
            const eDateVal = isPeriod ? document.getElementById('endDate').value : sDateVal;
            const sTimeVal = document.getElementById('startTime').value;
            const eTimeVal = document.getElementById('endTime').value;

            // 1. 必須項目の入力チェック
            if (!typeVal || !catVal || !sDateVal || !sTimeVal || !eTimeVal) {
                return alert("必須項目（種別、区分、開始日、開始時刻、終了時刻）を入力してください。");
            }

            // 期間指定（チェックボックスON）の場合、終了日が空でないかチェック
            if (isPeriod && !eDateVal) {
                return alert("期間指定の場合は、終了日を入力してください。");
            }

            // 2. 日付の前後関係チェック（期間指定の場合のみ、開始日が終了日より後になっていないか）
            if (isPeriod && sDateVal > eDateVal) {
                return alert("終了日は開始日以降の日付を指定してください。");
            }

            // 3. 時刻の前後関係チェック（★期間申請ではない場合のみ実行）
            if (!isPeriod) {
                // "08:30" と "17:30" のような文字列同士でも大小比較が可能です
                if (sTimeVal >= eTimeVal) {
                    return alert("終了時刻は開始時刻より後の時間を指定してください。");
                }
            }

            // チェックをすべて通過したら送信データを組み立てる
            const data = {
                userId: currentUser.id, 
                userName: currentUser.name,
                type: typeVal,
                category: catVal,
                compDate: document.getElementById('compDate').value,
                startDate: sDateVal,
                endDate: eDateVal,
                startTime: sTimeVal,
                endTime: eTimeVal,
                reason: document.getElementById('reason').value
            };

            showLoading(true, "送信中...");
            try {
                const json = await fetchGasPost('submit', data);
                if (json.status === 'success') { 
                    alert("申請が完了しました。");
                    if(woff.isLoggedIn()) { woff.closeWindow(); } else { location.reload(); }
                } else throw new Error(json.message);
            } catch (e) { 
                alert("送信失敗: " + e.message); 
            } finally { 
                showLoading(false); 
            }
        }

        async function fetchListData() {
            showLoading(true, "取得中...");
            try {
                const json = await fetchGasPost('getList', { userId: currentUser.id });
                if (json.status === 'success') renderHistory(json.data.filter(item => item.applicantId === currentUser.id));
            } catch (e) { alert("取得失敗"); }
            finally { showLoading(false); }
        }

     

　　　　function renderHistory(list) {
    　　　　　const container = document.getElementById('historyList');
    if (list.length === 0) return container.innerHTML = '<div class="bg-white p-4 text-center text-sm text-gray-500">履歴はありません</div>';
    
    container.innerHTML = list.map(item => {
        // 期間の表示判定：開始日と終了日が異なる場合は「～」で繋ぐ
        // ※GAS側で endDate: formatDateSafe(row[6]) を追加しておく必要があります
        const dateDisplay = (item.startDate === item.endDate || !item.endDate) 
            ? item.startDate 
            : `${item.startDate} ～ ${item.endDate}`;

        return `
            <div class="bg-white p-4 rounded-lg shadow-sm border border-l-4 ${item.status === '取消完了' || item.status === '取消済み' ? 'border-gray-400' : (item.status.includes('承認済み') || item.status.includes('完了') ? 'border-green-500' : 'border-yellow-400')}">
                <div class="flex justify-between items-center mb-2">
                    <span class="font-bold text-gray-800">${item.category}</span>
                    <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full font-bold">${item.status}</span>
                </div>
                <div class="text-sm text-gray-600 space-y-1 mb-3">
                    <p>対象期間: ${dateDisplay}</p>
                    <p>時間: ${item.startTime} ～ ${item.endTime}</p>
                </div>

                ${(item.status !== '取消完了' && item.status !== '取消済み' && item.status !== '取消申請中') ? 
                    `<button class="w-full text-red-500 bg-red-50 border border-red-200 hover:bg-red-100 font-bold rounded-md py-2 transition text-sm" onclick="cancelRequest('${item.uid}')">取消申請を行う</button>` : 
                    ''
                }
            </div>
        `;
    }).join('');
}
        
        async function cancelRequest(uid) {
            if(!confirm("この申請を取り消しますか？")) return;
            showLoading(true, "処理中...");
            try {
                const json = await fetchGasPost('cancel', { uid: uid });
                if (json.status === 'success') { alert("取消を申請しました"); fetchListData(); }
                else throw new Error(json.message);
            } catch (e) { alert("エラー: " + e.message); }
            finally { showLoading(false); }
        }
    </script>
</body>
</html>
