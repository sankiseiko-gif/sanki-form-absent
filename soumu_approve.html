<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【総務用】申請管理システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; }
        .schedule-grid { display: grid; grid-template-columns: 100px 1fr; border-top: 1px solid #e5e7eb; }
        .time-label { font-size: 10px; color: #9ca3af; text-align: center; }
        .bar-container { position: relative; height: 32px; background: #f9fafb; border-bottom: 1px solid #f3f4f6; }
        .absence-bar { position: absolute; height: 20px; top: 6px; border-radius: 4px; opacity: 0.9; }
        /* ツールチップのフェードイン効果 */
        .fade-in { animation: fadeIn 0.2s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-900">総務管理ダッシュボード</h1>
       　   <button id="updateBtn" onclick="fetchAllData()" class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded text-sm font-bold transition flex items-center justify-center gap-1 min-w-[140px]">
            <span id="updateIcon">🔄</span>
     　     <span id="updateText">最新の状態に更新</span>
　　　　　</button> 
        </div>
        <div class="max-w-5xl mx-auto px-4 flex gap-8">
            <button onclick="switchTab('basic')" id="tabBtn-basic" class="py-3 font-bold transition tab-active">基本一覧</button>
            <button onclick="switchTab('today')" id="tabBtn-today" class="py-3 font-bold text-gray-400 transition">本日の予定</button>
            <button onclick="switchTab('proxy')" id="tabBtn-proxy" class="py-3 font-bold text-gray-400 transition">代行承認</button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6">
        <section id="tab-basic" class="space-y-8"> 
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 flex flex-wrap gap-4 items-end">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">申請者名</label>
                    <input type="text" id="searchName" placeholder="名前を検索" class="border border-gray-300 p-2 rounded-md text-sm w-40" oninput="renderBasic()">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">種別・区分</label>
                    <input type="text" id="searchCategory" placeholder="有給、欠勤 など" class="border border-gray-300 p-2 rounded-md text-sm w-40" oninput="renderBasic()">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">該当日（期間内も検索可）</label>
                    <input type="date" id="searchDate" class="border border-gray-300 p-2 rounded-md text-sm w-40" onchange="renderBasic()">
                </div>
                <button onclick="clearSearch()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-md text-sm font-bold hover:bg-gray-200 border border-gray-300 transition mb-[1px]">
                    条件クリア
                </button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div><h3 class="font-bold mb-3 flex items-center gap-2">⏳ 申請中 <span id="count-apply" class="text-xs bg-yellow-100 text-yellow-700 px-2 rounded-full">0</span></h3><div id="list-apply" class="space-y-3"></div></div>
                <div><h3 class="font-bold mb-3 flex items-center gap-2">✅ 完了 <span id="count-done" class="text-xs bg-green-100 text-green-700 px-2 rounded-full">0</span></h3><div id="list-done" class="space-y-3"></div></div>
                <div><h3 class="font-bold mb-3 flex items-center gap-2">❌ 取消完了 <span id="count-cancel" class="text-xs bg-red-100 text-red-700 px-2 rounded-full">0</span></h3><div id="list-cancel" class="space-y-3"></div></div>
            </div>
            <!-- 修正フォームエリア (初期状態はhidden) -->
    <div id="editFormArea" class="hidden bg-white p-6 rounded-lg shadow-md mt-4 border-2 border-blue-400">
        <h2 class="text-xl font-bold mb-4 text-blue-700">申請内容の修正</h2>
    
        <input type="hidden" id="editUid">
    
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">申請者</label>
                <input type="text" id="editUserName" readonly class="w-full bg-gray-100 border border-gray-300 p-2 rounded-md font-bold text-gray-600">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">種別</label>
                    <select id="editTypeSelect" class="w-full border border-gray-300 p-2 rounded-md bg-white">
                        <option value="遅刻">遅刻</option>
                        <option value="早退">早退</option>
                        <option value="欠勤">欠勤</option>
                        <option value="外出">外出</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">区分</label>
                    <select id="editCategorySelect" class="w-full border border-gray-300 p-2 rounded-md bg-white">
                        <option value="">選択してください</option>
                        <option value="遅刻">遅刻</option>
                        <option value="早退">早退</option>
                        <option value="AM半休">AM半休</option>
                        <option value="PM半休">PM半休</option>
                        <option value="有給">有給</option>
                        <option value="欠勤">欠勤</option>
                        <option value="振替休日">振替休日</option>
                        <option value="忌引">忌引</option>
                        <option value="結婚">結婚</option>
                        <option value="外出">外出</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">対象日</label>
                <div class="flex items-center space-x-2 mb-2">
                    <input type="checkbox" id="editPeriodCheck" onchange="handleEditPeriodChange()" class="w-4 h-4 text-blue-600 rounded">
                    <label for="editPeriodCheck" class="text-sm text-gray-700 font-bold">期間で申請 </label>
                </div>
                <div class="flex items-center space-x-2">
                    <input type="date" id="editStartDate" class="w-full border border-gray-300 p-2 rounded-md bg-white">
                    <span id="editPeriodToLabel" class="hidden font-bold">～</span>
                    <input type="date" id="editEndDate" class="hidden w-full border border-gray-300 p-2 rounded-md bg-white">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">開始時刻</label>
                    <input type="time" id="editStartTime" class="w-full border border-gray-300 p-2 rounded-md bg-white">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">終了時刻</label>
                    <input type="time" id="editEndTime" class="w-full border border-gray-300 p-2 rounded-md bg-white">
                </div>
            </div>
        </div>

        <!-- アクションボタン -->
        <div class="mt-6 flex space-x-3">
            <button onclick="closeEditForm()" class="flex-1 bg-gray-200 text-gray-700 font-bold py-3 rounded-md hover:bg-gray-300 transition">
                キャンセル
            </button>
            <button onclick="updateApplicationByAdmin()" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-md hover:bg-blue-700 transition">
                保存してカレンダー更新
            </button>
        </div>
    </div>
    </section>

        <section id="tab-today" class="hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex items-center gap-4 mb-6">
                    <button onclick="changeDate(-1)" class="p-2 border rounded hover:bg-gray-50">◀</button>
                    <input type="date" id="targetDate" class="font-bold border-none text-lg outline-none" onchange="renderSchedule()">
                    <button onclick="changeDate(1)" class="p-2 border rounded hover:bg-gray-50">▶</button>
                    <button onclick="setToToday()" class="text-sm text-blue-600 font-bold ml-2">今日へ戻す</button>
                </div>
                
                <div class="overflow-x-auto">
                    <div class="min-w-[600px] pb-10">
                        <div class="schedule-grid py-2">
                            <div></div>
                            <div class="flex justify-between px-2">
                                <span class="time-label">8:30</span>
                                <span class="time-label">10:30</span>
                                <span class="time-label">12:30</span>
                                <span class="time-label">14:30</span>
                                <span class="time-label">16:30</span>
                                <span class="time-label">17:30</span>
                            </div>
                        </div>
                        <div id="schedule-rows" class="border border-gray-100 rounded bg-white"></div>
                    </div>
                </div>
            </div>
        </section>

        <section id="tab-proxy" class="hidden">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 border-b border-gray-100 text-sm font-bold text-gray-500">
                        <tr><th class="px-6 py-4">申請日</th><th class="px-6 py-4">申請者</th><th class="px-6 py-4">内容</th><th class="px-6 py-4 text-right">操作</th></tr>
                    </thead>
                    <tbody id="proxy-table-body" class="divide-y divide-gray-100"></tbody>
                </table>
                <div id="proxy-empty" class="p-10 text-center text-gray-400 hidden">未承認の申請はありません</div>
            </div>
        </section>
    </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxwEuHjXVsUjbhH9Bo5yQ3vgln5LM615sKftO5pQgzjpPzpRvXuxMcqmyNTNhEhaQeZ/exec";
        let allData = [];
        let colorMap = {};

        const HOURS = { start: 8.5, end: 17.5, total: 9 };

        window.onload = () => {
            setToToday();
            fetchAllData();
        };

        function switchTab(tabId) {
            ['basic', 'today', 'proxy'].forEach(id => {
                document.getElementById('tab-' + id).classList.toggle('hidden', id !== tabId);
                document.getElementById('tabBtn-' + id).classList.toggle('tab-active', id === tabId);
                document.getElementById('tabBtn-' + id).classList.toggle('text-gray-400', id !== tabId);
            });
            if (tabId === 'today') renderSchedule();
        }

        async function fetchAllData() {
            const btn = document.getElementById('updateBtn');
            const icon = document.getElementById('updateIcon');
            const text = document.getElementById('updateText');

            // ① ボタンを「更新中」状態にする
            btn.disabled = true; // 連打防止
            btn.classList.add('opacity-70', 'cursor-not-allowed', 'bg-blue-100', 'text-blue-700');
            btn.classList.remove('bg-gray-100', 'hover:bg-gray-200');
            icon.classList.add('animate-spin'); // ぐるぐる回す
            icon.innerText = '⏳';
            text.innerText = '更新中...';

        try {
            const res = await fetch(GAS_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "getList", payload: { role: "admin" } })
            });
            const json = await res.json();
        
           if (json.status === 'success') {
                allData = json.data;
                colorMap = json.colors || {};
                renderBasic();
                renderProxy();
                renderSchedule();

            // ② 成功したら「完了」表示にする
            icon.classList.remove('animate-spin');
            icon.innerText = '✅';
            text.innerText = '更新完了';
            btn.classList.replace('bg-blue-100', 'bg-green-100');
            btn.classList.replace('text-blue-700', 'text-green-800');
            }
        } catch (e) {
            console.error("データ取得エラー:", e);
            // エラー時の表示
            icon.classList.remove('animate-spin');
            icon.innerText = '❌';
            text.innerText = '通信エラー';
            btn.classList.replace('bg-blue-100', 'bg-red-100');
            btn.classList.replace('text-blue-700', 'text-red-800');
        } finally {
        // ③ 2秒後に元の「最新の状態に更新」ボタンに戻す
            setTimeout(() => {
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-not-allowed', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
                btn.classList.add('bg-gray-100', 'hover:bg-gray-200');
                icon.innerText = '🔄';
                text.innerText = '最新の状態に更新';
        }, 2000);
    }
}

        // 1. 基本一覧の表示

               

        // 2. スケジュールバーの表示
     function renderSchedule() {
            const target = document.getElementById('targetDate').value;
            const rows = document.getElementById('schedule-rows');
            
            // 追加：30人分（1行48px × 30人 = 1440px）の描写スペースをデフォルトで確保する
            rows.style.minHeight = "1440px"; 

            // カレンダー処理用：表示中の日付から曜日を取得（0:日, 6:土）
            const targetDateObj = new Date(target);
            const dayOfWeek = targetDateObj.getDay(); 

            const filtered = allData.filter(i => {
                const s = (i.status || "").trim();
                const isValidStatus = (s === '申請中' || s === '仮申請' || s === '完了' || s === '承認済み');
                if (!isValidStatus) return false;

                const sDate = i.startDate;
                const eDate = i.endDate || i.startDate;

                // 変更：ターゲット日が「開始日〜終了日」の期間内に含まれているかチェック
                if (target >= sDate && target <= eDate) {
                    // 土日は飛ばす（複数日申請の場合、土日はバーを表示させない）
                    if ((dayOfWeek === 0 || dayOfWeek === 6) && sDate !== eDate) {
                        return false;
                    }
                    return true;
                }
                return false;
            });
            
            if (filtered.length === 0) {
                rows.innerHTML = '<div class="p-10 text-center text-sm text-gray-400">予定はありません</div>';
                return;
            }

            rows.innerHTML = filtered.map(i => {
                const sDate = i.startDate;
                const eDate = i.endDate || i.startDate;
                
                let dayStartStr = i.startTime;
                let dayEndStr = i.endTime;

                // 複数日の場合の表示時間コントロール
                if (sDate !== eDate) {
                    if (target === sDate) {
                        // 開始日: 開始時間 ～ 17:30
                        dayEndStr = "17:30";
                    } else if (target === eDate) {
                        // 終了日: 8:30 ～ 終了時間
                        dayStartStr = "08:30";
                    } else {
                        // 中日: 8:30 ～ 17:30
                        dayStartStr = "08:30";
                        dayEndStr = "17:30";
                    }
                }

                const startDec = timeToDecimal(dayStartStr);
                const endDec = timeToDecimal(dayEndStr);
                const s = Math.max(HOURS.start, startDec);
                const e = Math.min(HOURS.end, endDec);
                const left = ((s - HOURS.start) / HOURS.total) * 100;
                const width = ((e - s) / HOURS.total) * 100;

                const displayText = (i.type === '欠勤') ? i.category : i.type;
                const bgColor = colorMap[displayText] || '#3b82f6';

                // ツールチップ用の全体期間テキスト
                const dateDisplay = (sDate === eDate) ? sDate : `${sDate} ～ ${eDate}`;

                return `
                    <div class="schedule-grid items-center h-12 border-b border-gray-50 hover:bg-gray-50 transition group relative">
                        <div class="px-3 text-xs font-bold border-r border-gray-100 truncate text-gray-700">${i.userName}</div>
                        <div class="bar-container bg-transparent">
                            <div class="absence-bar flex items-center justify-center text-[10px] text-white font-bold shadow-sm" 
                                 style="left: ${left}%; width: ${width}%; background-color: ${bgColor};"
                                 title="本日の時間: ${dayStartStr} ～ ${dayEndStr}">
                                ${displayText}
                            </div>
                        </div>
                        <div class="hidden group-hover:block absolute left-28 z-50 top-10 p-2 bg-gray-800 text-white text-xs rounded shadow-xl fade-in pointer-events-none min-w-[200px]">
                            <span class="text-blue-300 font-bold">期間:</span> ${dateDisplay}<br>
                            <span class="text-blue-300 font-bold mt-1 block">本日の時間:</span> ${dayStartStr} ～ ${dayEndStr}<br>
                            <span class="text-blue-300 font-bold mt-1 block">理由:</span>
                            <div class="whitespace-pre-wrap">${i.reason || '（記載なし）'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 3. 代行承認タブの表示
        function renderProxy() {
            const list = allData.filter(i => (i.status || "").includes('申請中') || (i.status || "").includes('仮申請'))
                                .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            const body = document.getElementById('proxy-table-body');
            document.getElementById('proxy-empty').classList.toggle('hidden', list.length > 0);
            
            body.innerHTML = list.map(i => {
                // 追加：開始日と終了日が異なる場合は「～」で繋ぐ
                const dateDisplay = (i.startDate === i.endDate || !i.endDate) 
                    ? i.startDate 
                    : `${i.startDate} ～ ${i.endDate}`;

                return `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4 text-xs text-gray-500">${dateDisplay}</td>
                    <td class="px-6 py-4 font-bold text-sm text-gray-800">${i.userName}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">${i.category} (${i.startTime}～)</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="proxyApprove('${i.uid}')" class="bg-blue-600 text-white text-xs px-4 py-2 rounded font-bold hover:bg-blue-700 shadow-sm transition">代行承認</button>
                    </td>
                </tr>
                `;
            }).join('');
        }

        async function proxyApprove(uid) {
            if (!confirm("上長代行としてこの申請を承認しますか？")) return;
            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "approve", payload: { uid: uid, execUserName: "上長代行" } })
                });
                const json = await res.json();
                if (json.status === 'success') { 
                    alert("代行承認が完了しました"); 
                    fetchAllData(); 
                } else {
                    alert("承認エラー: " + json.message);
                }
            } catch (e) {
                alert("通信エラーが発生しました。");
            }
        }

// ==========================================
// 修正フォームの表示制御・データセット
// ==========================================
function openEditForm(itemJson) {
    // ボタンから渡された文字列データ(JSON)をオブジェクトに戻す
    const item = JSON.parse(decodeURIComponent(itemJson));

    // フォームに値をセット
    document.getElementById('editUid').value = item.uid;
    document.getElementById('editUserName').value = item.userName;
    document.getElementById('editTypeSelect').value = item.type;
    document.getElementById('editCategorySelect').value = item.category;
    document.getElementById('editStartDate').value = item.startDate;
    
    // 期間申請かどうかの判定
    const isPeriod = (item.endDate && item.startDate !== item.endDate);
    document.getElementById('editPeriodCheck').checked = isPeriod;
    document.getElementById('editEndDate').value = isPeriod ? item.endDate : '';
    handleEditPeriodChange(); // 表示の切り替え

    document.getElementById('editStartTime').value = item.startTime;
    document.getElementById('editEndTime').value = item.endTime;

    // 修正フォームを表示し、一覧などを隠す（※一覧のIDに合わせて変更してください）
    document.getElementById('editFormArea').classList.remove('hidden');
    // document.getElementById('adminListArea').classList.add('hidden'); // 一覧を隠す場合
    
    // フォームの位置までスクロール
    document.getElementById('editFormArea').scrollIntoView({ behavior: 'smooth' });
}

function closeEditForm() {
    document.getElementById('editFormArea').classList.add('hidden');
    // document.getElementById('adminListArea').classList.remove('hidden'); // 一覧を再表示する場合
}

function handleEditPeriodChange() {
    const isP = document.getElementById('editPeriodCheck').checked;
    const ew = document.getElementById('editEndDate');
    const lb = document.getElementById('editPeriodToLabel');
    if (isP) { 
        ew.classList.remove('hidden'); 
        lb.classList.remove('hidden'); 
    } else { 
        ew.classList.add('hidden'); 
        lb.classList.add('hidden'); 
        ew.value = ''; 
    }
}

// ==========================================
// 修正データをGASへ送信（更新とカレンダー置き換え）
// ==========================================
async function updateApplicationByAdmin() {
    const uid = document.getElementById('editUid').value;
    const isPeriod = document.getElementById('editPeriodCheck').checked;
    const typeVal = document.getElementById('editTypeSelect').value;
    const catVal = document.getElementById('editCategorySelect').value;
    const sDateVal = document.getElementById('editStartDate').value;
    const eDateVal = isPeriod ? document.getElementById('editEndDate').value : sDateVal;
    const sTimeVal = document.getElementById('editStartTime').value;
    const eTimeVal = document.getElementById('editEndTime').value;

    // 入力チェック（バリデーション）
    if (!typeVal || !catVal || !sDateVal || !sTimeVal || !eTimeVal) {
        return alert("必須項目を入力してください。");
    }
    if (isPeriod && !eDateVal) {
        return alert("期間指定の場合は、終了日を入力してください。");
    }
    if (isPeriod && sDateVal > eDateVal) {
        return alert("終了日は開始日以降の日付を指定してください。");
    }
    if (!isPeriod && sTimeVal >= eTimeVal) {
        return alert("終了時刻は開始時刻より後の時間を指定してください。");
    }

    if (!confirm("修正内容を保存し、カレンダーの予定も更新しますか？")) return;

    const updateData = {
        uid: uid,
        userName: document.getElementById('editUserName').value,
        type: typeVal,
        category: catVal,
        startDate: sDateVal,
        endDate: eDateVal,
        startTime: sTimeVal,
        endTime: eTimeVal
    };

    showLoading(true, "更新中...");
    try {
        const json = await fetchGasPost('updateRecord', updateData);
        if (json.status === 'success') { 
            alert("修正とカレンダーの更新が完了しました。");
            closeEditForm();
            fetchAllData(); // ※一覧を再取得する関数名に合わせてください
        } else {
            throw new Error(json.message);
        }
    } catch (e) { 
        alert("更新失敗: " + e.message); 
    } finally { 
        showLoading(false); 
    }
}
        
        function timeToDecimal(t) {
            if (!t) return 0;
            const [h, m] = t.split(':').map(Number);
            return h + (m / 60);
        }

        function changeDate(days) {

            renderSchedule();
        }

        function setToToday() {
            const d = new Date();
            const jstDate = new Date(d.getTime() + (9 * 60 * 60 * 1000));
            document.getElementById('targetDate').value = jstDate.toISOString().split('T')[0];
            if (allData.length > 0) renderSchedule();
        }

// GASへPOSTリクエストを送る共通関数
async function fetchGasPost(action, payload) {
    const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: action, payload: payload })
    });
    return res.json();
}

function showLoading(isShowing, text) {
    // 編集フォームエリア内のボタンをすべて取得
    const buttons = document.querySelectorAll('#editFormArea button');
    
    // 2つ目のボタン（インデックス1）が「保存」ボタン
    if (buttons.length >= 2) {
        const btn = buttons[1]; 
        btn.innerText = isShowing ? text : "保存してカレンダー更新";
        btn.disabled = isShowing;
        btn.className = isShowing 
            ? "flex-1 bg-blue-300 text-white font-bold py-3 rounded-md cursor-wait" 
            : "flex-1 bg-blue-600 text-white font-bold py-3 rounded-md hover:bg-blue-700 transition";
    }
}
