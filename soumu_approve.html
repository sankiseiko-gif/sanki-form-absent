<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【総務用】申請管理システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; }
        .schedule-grid { display: grid; grid-template-columns: 100px 1fr; border-top: 1px solid #e5e7eb; }
        .time-label { font-size: 10px; color: #9ca3af; text-align: center; }
        .bar-container { position: relative; height: 32px; background: #f9fafb; border-bottom: 1px solid #f3f4f6; }
        .absence-bar { position: absolute; height: 20px; top: 6px; border-radius: 4px; opacity: 0.9; }
        /* ツールチップのフェードイン効果 */
        .fade-in { animation: fadeIn 0.2s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-900">総務管理ダッシュボード</h1>
       　   <button id="updateBtn" onclick="fetchAllData()" class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded text-sm font-bold transition flex items-center justify-center gap-1 min-w-[140px]">
            <span id="updateIcon">🔄</span>
     　     <span id="updateText">最新の状態に更新</span>
　　　　　</button> 
        </div>
        <div class="max-w-5xl mx-auto px-4 flex gap-8">
            <button onclick="switchTab('basic')" id="tabBtn-basic" class="py-3 font-bold transition tab-active">基本一覧</button>
            <button onclick="switchTab('today')" id="tabBtn-today" class="py-3 font-bold text-gray-400 transition">本日の予定</button>
            <button onclick="switchTab('proxy')" id="tabBtn-proxy" class="py-3 font-bold text-gray-400 transition">代行承認</button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6">
        <section id="tab-basic" class="space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div><h3 class="font-bold mb-3 flex items-center gap-2">⏳ 申請中 <span id="count-apply" class="text-xs bg-yellow-100 text-yellow-700 px-2 rounded-full">0</span></h3><div id="list-apply" class="space-y-3"></div></div>
                <div><h3 class="font-bold mb-3 flex items-center gap-2">✅ 完了 <span id="count-done" class="text-xs bg-green-100 text-green-700 px-2 rounded-full">0</span></h3><div id="list-done" class="space-y-3"></div></div>
                <div><h3 class="font-bold mb-3 flex items-center gap-2">❌ 取消完了 <span id="count-cancel" class="text-xs bg-red-100 text-red-700 px-2 rounded-full">0</span></h3><div id="list-cancel" class="space-y-3"></div></div>
            </div>
        </section>

        <section id="tab-today" class="hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex items-center gap-4 mb-6">
                    <button onclick="changeDate(-1)" class="p-2 border rounded hover:bg-gray-50">◀</button>
                    <input type="date" id="targetDate" class="font-bold border-none text-lg outline-none" onchange="renderSchedule()">
                    <button onclick="changeDate(1)" class="p-2 border rounded hover:bg-gray-50">▶</button>
                    <button onclick="setToToday()" class="text-sm text-blue-600 font-bold ml-2">今日へ戻す</button>
                </div>
                
                <div class="overflow-x-auto">
                    <div class="min-w-[600px] pb-10">
                        <div class="schedule-grid py-2">
                            <div></div>
                            <div class="flex justify-between px-2">
                                <span class="time-label">8:30</span>
                                <span class="time-label">10:30</span>
                                <span class="time-label">12:30</span>
                                <span class="time-label">14:30</span>
                                <span class="time-label">16:30</span>
                                <span class="time-label">17:30</span>
                            </div>
                        </div>
                        <div id="schedule-rows" class="border border-gray-100 rounded bg-white"></div>
                    </div>
                </div>
            </div>
        </section>

        <section id="tab-proxy" class="hidden">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 border-b border-gray-100 text-sm font-bold text-gray-500">
                        <tr><th class="px-6 py-4">申請日</th><th class="px-6 py-4">申請者</th><th class="px-6 py-4">内容</th><th class="px-6 py-4 text-right">操作</th></tr>
                    </thead>
                    <tbody id="proxy-table-body" class="divide-y divide-gray-100"></tbody>
                </table>
                <div id="proxy-empty" class="p-10 text-center text-gray-400 hidden">未承認の申請はありません</div>
            </div>
        </section>
    </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxwEuHjXVsUjbhH9Bo5yQ3vgln5LM615sKftO5pQgzjpPzpRvXuxMcqmyNTNhEhaQeZ/exec";
        let allData = [];
        let colorMap = {};

        const HOURS = { start: 8.5, end: 17.5, total: 9 };

        window.onload = () => {
            setToToday();
            fetchAllData();
        };

        function switchTab(tabId) {
            ['basic', 'today', 'proxy'].forEach(id => {
                document.getElementById('tab-' + id).classList.toggle('hidden', id !== tabId);
                document.getElementById('tabBtn-' + id).classList.toggle('tab-active', id === tabId);
                document.getElementById('tabBtn-' + id).classList.toggle('text-gray-400', id !== tabId);
            });
            if (tabId === 'today') renderSchedule();
        }

        async function fetchAllData() {
            const btn = document.getElementById('updateBtn');
            const icon = document.getElementById('updateIcon');
            const text = document.getElementById('updateText');

            // ① ボタンを「更新中」状態にする
            btn.disabled = true; // 連打防止
            btn.classList.add('opacity-70', 'cursor-not-allowed', 'bg-blue-100', 'text-blue-700');
            btn.classList.remove('bg-gray-100', 'hover:bg-gray-200');
            icon.classList.add('animate-spin'); // ぐるぐる回す
            icon.innerText = '⏳';
            text.innerText = '更新中...';

        try {
            const res = await fetch(GAS_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "getList", payload: { role: "admin" } })
            });
            const json = await res.json();
        
           if (json.status === 'success') {
                allData = json.data;
                colorMap = json.colors || {};
                renderBasic();
                renderProxy();
                renderSchedule();

            // ② 成功したら「完了」表示にする
            icon.classList.remove('animate-spin');
            icon.innerText = '✅';
            text.innerText = '更新完了';
            btn.classList.replace('bg-blue-100', 'bg-green-100');
            btn.classList.replace('text-blue-700', 'text-green-800');
            }
        } catch (e) {
            console.error("データ取得エラー:", e);
            // エラー時の表示
            icon.classList.remove('animate-spin');
            icon.innerText = '❌';
            text.innerText = '通信エラー';
            btn.classList.replace('bg-blue-100', 'bg-red-100');
            btn.classList.replace('text-blue-700', 'text-red-800');
        } finally {
        // ③ 2秒後に元の「最新の状態に更新」ボタンに戻す
            setTimeout(() => {
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-not-allowed', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
                btn.classList.add('bg-gray-100', 'hover:bg-gray-200');
                icon.innerText = '🔄';
                text.innerText = '最新の状態に更新';
        }, 2000);
    }
}

        // 1. 基本一覧の表示
        function renderBasic() {
        const categories = {
            // 「申請中」「仮申請」に完全一致するものだけ
            'apply': allData.filter(i => {
                const s = (i.status || "").trim();
                return s === '申請中' || s === '仮申請' || s === '上長承認';
            }),
            // 「完了」「承認済み」に完全一致するものだけ
            'done': allData.filter(i => {
                const s = (i.status || "").trim();
                return s === '完了' || s === '承認済み';
            }),
            // 「取消完了」「取消済み」に完全一致するものだけ
            'cancel': allData.filter(i => {
                const s = (i.status || "").trim();
                return s === '取消完了' || s === '取消済み';
            })
        };

        for (let key in categories) {
            document.getElementById(`count-${key}`).innerText = categories[key].length;
            document.getElementById(`list-${key}`).innerHTML = categories[key].map(i => {
                // 追加：期間の表示判定（開始日と終了日が異なる場合は「～」で繋ぐ）
                const dateDisplay = (i.startDate === i.endDate || !i.endDate) 
                    ? i.startDate 
                    : `${i.startDate} ～ ${i.endDate}`;

                return `
                    <div class="bg-white p-3 rounded border border-gray-200 text-sm shadow-sm hover:shadow transition relative group cursor-pointer">
                        <div class="font-bold text-gray-800">${i.userName}</div>
                        <div class="text-gray-500 text-[11px]">${dateDisplay} / ${i.category}</div>
                        <div class="text-blue-600 font-bold mt-1 text-[12px]">
                        🕒 ${i.startTime} ～ ${i.endTime}
                        </div>
                        <div class="hidden group-hover:block absolute z-50 bottom-full left-0 mb-2 w-full p-3 bg-gray-800 text-white text-xs rounded shadow-xl fade-in pointer-events-none">
                           <span class="font-bold text-blue-300 border-b border-gray-600 pb-1 mb-1 block">理由</span>
                           <div class="whitespace-pre-wrap leading-relaxed">${i.reason || '（記載なし）'}</div>
                        </div>
                    </div>
                `;
            }).join('');
          }
        }
               

        // 2. スケジュールバーの表示
     function renderSchedule() {
            const target = document.getElementById('targetDate').value;
            const rows = document.getElementById('schedule-rows');
            
            // 追加：30人分（1行48px × 30人 = 1440px）の描写スペースをデフォルトで確保する
            rows.style.minHeight = "1440px"; 

            // カレンダー処理用：表示中の日付から曜日を取得（0:日, 6:土）
            const targetDateObj = new Date(target);
            const dayOfWeek = targetDateObj.getDay(); 

            const filtered = allData.filter(i => {
                const s = (i.status || "").trim();
                const isValidStatus = (s === '申請中' || s === '仮申請' || s === '完了' || s === '承認済み');
                if (!isValidStatus) return false;

                const sDate = i.startDate;
                const eDate = i.endDate || i.startDate;

                // 変更：ターゲット日が「開始日〜終了日」の期間内に含まれているかチェック
                if (target >= sDate && target <= eDate) {
                    // 土日は飛ばす（複数日申請の場合、土日はバーを表示させない）
                    if ((dayOfWeek === 0 || dayOfWeek === 6) && sDate !== eDate) {
                        return false;
                    }
                    return true;
                }
                return false;
            });
            
            if (filtered.length === 0) {
                rows.innerHTML = '<div class="p-10 text-center text-sm text-gray-400">予定はありません</div>';
                return;
            }

            rows.innerHTML = filtered.map(i => {
                const sDate = i.startDate;
                const eDate = i.endDate || i.startDate;
                
                let dayStartStr = i.startTime;
                let dayEndStr = i.endTime;

                // 複数日の場合の表示時間コントロール
                if (sDate !== eDate) {
                    if (target === sDate) {
                        // 開始日: 開始時間 ～ 17:30
                        dayEndStr = "17:30";
                    } else if (target === eDate) {
                        // 終了日: 8:30 ～ 終了時間
                        dayStartStr = "08:30";
                    } else {
                        // 中日: 8:30 ～ 17:30
                        dayStartStr = "08:30";
                        dayEndStr = "17:30";
                    }
                }

                const startDec = timeToDecimal(dayStartStr);
                const endDec = timeToDecimal(dayEndStr);
                const s = Math.max(HOURS.start, startDec);
                const e = Math.min(HOURS.end, endDec);
                const left = ((s - HOURS.start) / HOURS.total) * 100;
                const width = ((e - s) / HOURS.total) * 100;

                const displayText = (i.type === '欠勤') ? i.category : i.type;
                const bgColor = colorMap[displayText] || '#3b82f6';

                // ツールチップ用の全体期間テキスト
                const dateDisplay = (sDate === eDate) ? sDate : `${sDate} ～ ${eDate}`;

                return `
                    <div class="schedule-grid items-center h-12 border-b border-gray-50 hover:bg-gray-50 transition group relative">
                        <div class="px-3 text-xs font-bold border-r border-gray-100 truncate text-gray-700">${i.userName}</div>
                        <div class="bar-container bg-transparent">
                            <div class="absence-bar flex items-center justify-center text-[10px] text-white font-bold shadow-sm" 
                                 style="left: ${left}%; width: ${width}%; background-color: ${bgColor};"
                                 title="本日の時間: ${dayStartStr} ～ ${dayEndStr}">
                                ${displayText}
                            </div>
                        </div>
                        <div class="hidden group-hover:block absolute left-28 z-50 top-10 p-2 bg-gray-800 text-white text-xs rounded shadow-xl fade-in pointer-events-none min-w-[200px]">
                            <span class="text-blue-300 font-bold">期間:</span> ${dateDisplay}<br>
                            <span class="text-blue-300 font-bold mt-1 block">本日の時間:</span> ${dayStartStr} ～ ${dayEndStr}<br>
                            <span class="text-blue-300 font-bold mt-1 block">理由:</span>
                            <div class="whitespace-pre-wrap">${i.reason || '（記載なし）'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 3. 代行承認タブの表示
        function renderProxy() {
            const list = allData.filter(i => (i.status || "").includes('申請中') || (i.status || "").includes('仮申請'))
                                .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            const body = document.getElementById('proxy-table-body');
            document.getElementById('proxy-empty').classList.toggle('hidden', list.length > 0);
            
            body.innerHTML = list.map(i => {
                // 追加：開始日と終了日が異なる場合は「～」で繋ぐ
                const dateDisplay = (i.startDate === i.endDate || !i.endDate) 
                    ? i.startDate 
                    : `${i.startDate} ～ ${i.endDate}`;

                return `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4 text-xs text-gray-500">${dateDisplay}</td>
                    <td class="px-6 py-4 font-bold text-sm text-gray-800">${i.userName}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">${i.category} (${i.startTime}～)</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="proxyApprove('${i.uid}')" class="bg-blue-600 text-white text-xs px-4 py-2 rounded font-bold hover:bg-blue-700 shadow-sm transition">代行承認</button>
                    </td>
                </tr>
                `;
            }).join('');
        }

        async function proxyApprove(uid) {
            if (!confirm("上長代行としてこの申請を承認しますか？")) return;
            try {
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "approve", payload: { uid: uid, execUserName: "上長代行" } })
                });
                const json = await res.json();
                if (json.status === 'success') { 
                    alert("代行承認が完了しました"); 
                    fetchAllData(); 
                } else {
                    alert("承認エラー: " + json.message);
                }
            } catch (e) {
                alert("通信エラーが発生しました。");
            }
        }

        function timeToDecimal(t) {
            if (!t) return 0;
            const [h, m] = t.split(':').map(Number);
            return h + (m / 60);
        }

        function changeDate(days) {
            const d = new Date(document.getElementById('targetDate').value);
            d.setDate(d.getDate() + days);
            document.getElementById('targetDate').value = d.toISOString().split('T')[0];
            renderSchedule();
        }

        function setToToday() {
            const d = new Date();
            const jstDate = new Date(d.getTime() + (9 * 60 * 60 * 1000));
            document.getElementById('targetDate').value = jstDate.toISOString().split('T')[0];
            if (allData.length > 0) renderSchedule();
        }
    </script>
</body>
</html>
